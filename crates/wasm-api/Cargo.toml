[package]
name = "wasm-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: nixpkgs ships wasm-bindgen-cli 0.2.129 only, and the CLI must match the crate exactly.
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
console_error_panic_hook = "0.1"
serde_json = "1"
solver = { path = "../solver" }
poe1 = { path = "../poe1" }
